name: Actualizar precios

on:
  schedule:
    - cron: '23 12 * * *'   # todos los días ~6:23 am hora de CDMX
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/precios.yml'

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bajar precios de PROFECO
        run: node scripts/actualizar.mjs
        env:
          CIUDADES: '0901,1502'
      - name: Guardar cambios
        run: |
          git config user.name "Plato Justo bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r precios.json farmacia.json debug /tmp/out/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/out/* .
          git add -A precios.json farmacia.json debug
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Precios del $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
